[pytest]
testpaths = tests
pythonpath = packages
# Drop pytest's default *_test.py pattern: windows/mac_production_test.py drive a
# live install (real setup, cold reindex, connect/disconnect) and must only run
# when invoked directly, never as part of the unit suite.
python_files = test_*.py
# Integration tests drive the real ~/.scubiee home and installed CLI; opt in with
# `pytest -m integration` so a default run cannot damage a working machine.
addopts = -m "not integration"
markers =
    slow: runs full parse on scubiee-news-flow
    integration: live Scubiee engine + enrolled repo (skipped when daemon down)
