# Publish scubiee to PyPI and npm on version tag (v0.2.x).

name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Preferred: add PYPI_API_TOKEN in repo secrets (Account settings → API tokens).
          # OIDC trusted publishing also works when configured on PyPI for this repo.
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    runs-on: ubuntu-latest
    needs: pypi
    if: success() || failure()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
