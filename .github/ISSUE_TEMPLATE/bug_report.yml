name: Bug report
description: Report a reproducible problem with Scubiee
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search [existing issues](https://github.com/Usmansayed/scubiee/issues) first.

        **Do not include secrets, API keys, tokens, or private source code.** Issues are public.
        **Security vulnerabilities must be reported privately**: see [SECURITY.md](https://github.com/Usmansayed/scubiee/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `scubiee init .` in a repo with ...
        2. Ask the agent to ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, if not already clear from the description.
  - type: input
    id: version
    attributes:
      label: Scubiee version or commit
      description: Output of `scubiee --version`, or a commit hash if running from source.
      placeholder: "0.3.174"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15 (M3) / Ubuntu 24.04"
  - type: input
    id: accelerator
    attributes:
      label: Accelerator
      placeholder: "CUDA / DirectML / MLX / CPU"
  - type: input
    id: client
    attributes:
      label: IDE or MCP client
      placeholder: "Cursor / Claude Code / Kiro / Copilot / ..."
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (sanitized)
      description: |
        Output of `scubiee doctor .`, a diagnostic bundle from `scubiee diagnose --no-tests --desktop`, or the relevant tail of `~/.scubiee/engine.log`. Remove anything sensitive first.
      render: text
