name: Feature request
description: Suggest an improvement to Scubiee
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search [existing issues](https://github.com/Usmansayed/scubiee/issues) first. For large or architectural changes, a short discussion here before any code saves everyone time.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that Scubiee makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to see. If it touches the MCP tools (`map find` / `focus`, `gate`, `status`), describe the agent-facing behavior.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Expected benefit
      description: Who benefits, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, if any.
