[project]
name = "scubiee"
version = "0.2.18"
description = "Scubiee — local Cursor MCP context engine: setup once, ctx init per repo, CUDA/DirectML/MLX/CPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "requests>=2.31",
  "networkx>=3.2",
  "rapidfuzz>=3.0",
  "psutil>=5.9",
  "tree-sitter>=0.23.0,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-json>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "mcp>=1.0,<2",
  "huggingface_hub>=0.20",
  # Mac: pip install scubiee pulls the Metal stack (no extra required).
  "fastembed>=0.4; sys_platform == 'darwin'",
  "onnxruntime>=1.17; sys_platform == 'darwin'",
  "onnx>=1.16; sys_platform == 'darwin'",
  "tokenizers>=0.15; sys_platform == 'darwin'",
  "mlx>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# Pick ONE via: ctx setup  (uninstalls conflicting ORT wheels)
cpu = ["fastembed>=0.4", "onnxruntime>=1.17"]
coreml = ["fastembed>=0.4", "onnxruntime>=1.17", "onnx>=1.16"]
dml = ["fastembed>=0.4", "onnxruntime-directml>=1.17"]
cuda = ["fastembed>=0.4", "onnxruntime-gpu>=1.17"]
macos = ["fastembed>=0.4", "onnxruntime>=1.17", "onnx>=1.16", "mlx>=0.22"]
mlx = ["mlx>=0.22", "fastembed>=0.4", "onnx>=1.16", "onnxruntime>=1.17"]
embed-st = ["sentence-transformers>=3.0", "torch", "einops"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
ctx = "pipeline.__main__:main"
scubiee = "pipeline.__main__:main"
ctx-mcp = "pipeline.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Usmansayed/new-context-engine"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = [
  "pipeline*",
  "hybrid_cbm*",
  "conductor*",
  "enrich*",
  "metadata*",
  "repo_ir*",
  "parse_harness*",
  "graphify*",
]

[tool.setuptools.package-data]
pipeline = ["dashboard_ui/*", "templates/*"]

