[project]
name = "scubiee"
version = "0.2.32"
description = "Scubiee — local AI code context engine: setup once, scubiee connect per tool, DirectML/MLX/CUDA/CPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "requests>=2.31",
  "networkx>=3.2",
  "rapidfuzz>=3.0",
  "psutil>=5.9",
  "tree-sitter>=0.23.0,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-json>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "mcp>=1.0,<2",
  "loguru>=0.7",
  "huggingface_hub>=0.20",
  "fastembed>=0.4",
  "onnxruntime>=1.17,<1.25; platform_machine != 'arm64' or sys_platform != 'darwin'",
  "tokenizers>=0.15",
  # Mac: MLX + CoreML stack.
  "onnx>=1.16; sys_platform == 'darwin'",
  "mlx>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# scubiee setup auto-detects the best profile. These extras are for explicit control.
cpu = ["fastembed>=0.4", "onnxruntime>=1.17,<1.25"]
coreml = ["fastembed>=0.4", "onnxruntime>=1.17,<1.25", "onnx>=1.16"]
dml = ["fastembed>=0.4", "onnxruntime-directml>=1.17,<1.25"]
cuda = ["fastembed>=0.4", "onnxruntime-gpu>=1.17,<1.25"]
macos = ["fastembed>=0.4", "onnxruntime>=1.17", "onnx>=1.16", "mlx>=0.22"]
mlx = ["mlx>=0.22", "fastembed>=0.4", "onnx>=1.16", "onnxruntime>=1.17"]
embed-st = ["sentence-transformers>=3.0", "torch", "einops"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
scubiee = "pipeline.__main__:main"
scubiee-mcp = "pipeline.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Usmansayed/new-context-engine"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = [
  "pipeline*",
  "hybrid_cbm*",
  "conductor*",
  "enrich*",
  "metadata*",
  "repo_ir*",
  "parse_harness*",
  "graphify*",
]

[tool.setuptools.package-data]
pipeline = ["dashboard_ui/*", "templates/*"]

