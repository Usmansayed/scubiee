[project]
name = "scubiee"
version = "0.3.8"
description = "Scubiee — local AI code context engine: setup once, connect tools, CUDA/DirectML/MLX/CPU."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "requests>=2.31",
  "networkx>=3.2",
  "rapidfuzz>=3.0",
  "psutil>=5.9",
  "tree-sitter>=0.23.0,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-json>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "mcp>=1.0,<2",
  "loguru>=0.7",
  "huggingface_hub>=0.20",
  "Pillow>=10.0",
  "loguru>=0.7.2",
  "mmh3>=4.1.0",
  "tomli>=2.0.0",
  "py-rust-stemmers>=0.1.0",
  "tokenizers>=0.15",
  "onnx>=1.16",
  # Mac: pip install scubiee pulls the Metal stack (no extra required).
  "fastembed>=0.4; sys_platform == 'darwin'",
  "onnxruntime>=1.17,<1.25; sys_platform == 'darwin'",
  "onnx>=1.16; sys_platform == 'darwin'",
  "mlx>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # Windows/Linux: base wheel must include ORT embed stack (uv tool install has no extras).
  "fastembed>=0.4; sys_platform == 'win32' or sys_platform == 'linux'",
  "onnxruntime>=1.17,<1.25; sys_platform == 'linux'",
  "onnxruntime-directml>=1.17,<1.25; sys_platform == 'win32'",
  "onnx>=1.16; sys_platform == 'win32' or sys_platform == 'linux'",
]

[project.optional-dependencies]
# Pick ONE via: scubiee setup  (uninstalls conflicting ORT wheels)
cpu = ["fastembed>=0.4", "onnxruntime>=1.17,<1.25", "onnx>=1.16"]
coreml = ["fastembed>=0.4", "onnxruntime>=1.17,<1.25", "onnx>=1.16"]
dml = ["fastembed>=0.4", "onnxruntime-directml>=1.17,<1.25", "onnx>=1.16"]
cuda = ["fastembed>=0.4", "onnxruntime-gpu>=1.17,<1.25", "onnxruntime<1.25", "onnx>=1.16"]
macos = ["fastembed>=0.4", "onnxruntime>=1.17,<1.25", "onnx>=1.16", "mlx>=0.22"]
mlx = ["mlx>=0.22", "fastembed>=0.4", "onnx>=1.16", "onnxruntime>=1.17,<1.25"]
embed-st = ["sentence-transformers>=3.0", "torch", "einops"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
scubiee = "pipeline.__main__:main"
scubiee-mcp = "pipeline.mcp_server:main"
scubiee-mcp-bridge = "pipeline.mcp_bridge:main"

[project.urls]
Homepage = "https://github.com/Usmansayed/new-context-engine"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = [
  "pipeline*",
  "hybrid_cbm*",
  "conductor*",
  "enrich*",
  "metadata*",
  "repo_ir*",
  "parse_harness*",
  "graphify*",
]

[tool.setuptools.package-data]
pipeline = ["dashboard_ui/*", "templates/*"]
