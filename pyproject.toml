[project]
name = "context-engine"
version = "0.1.0"
description = "Cursor MCP for code search (Merkle + Graphify + CodeRank + FAISS). One-command install."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.8",
  "requests>=2.31",
  "networkx>=3.2",
  "rapidfuzz>=3.0",
  "psutil>=5.9",
  "tree-sitter>=0.23.0,<0.26",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-json>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# Pick ONE via: python -m pipeline init  (uninstalls conflicting ORT wheels)
cpu = ["fastembed>=0.4", "onnxruntime>=1.17"]
dml = ["fastembed>=0.4", "onnxruntime-directml>=1.17"]
cuda = ["fastembed>=0.4", "onnxruntime-gpu>=1.17"]
embed-st = ["sentence-transformers>=3.0", "torch", "einops"]
mcp = ["mcp>=1.0,<2"]

[project.scripts]
ctx = "pipeline.__main__:main"
ctx-mcp = "pipeline.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = [
  "pipeline*",
  "hybrid_cbm*",
  "conductor*",
  "enrich*",
  "metadata*",
  "repo_ir*",
  "parse_harness*",
  "graphify*",
]
